<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 演示首页</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        color: #e2e8f0;
        background: #0f172a;
      }

      header {
        max-width: 1400px;
        margin: 0 auto 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      header p {
        margin: 0;
        font-size: 14px;
        color: #94a3b8;
      }

      header code {
        padding: 2px 6px;
        font-family: Consolas, Monaco, monospace;
        font-size: 12px;
        color: #c4b5fd;
        background: #1e1b4b;
        border-radius: 6px;
      }

      .task-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .task-panel {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #111827;
        border: 1px solid #1e293b;
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      .task-panel h2 {
        margin: 0;
        padding: 14px 18px;
        font-size: 15px;
        font-weight: 600;
        color: #cbd5e1;
        background: #0b1220;
        border-bottom: 1px solid #1e293b;
      }

      iframe {
        width: 100%;
        height: 640px;
        background: #ffffff;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Task 演示首页</h1>
      <p>
        使用 <code>--path=task1</code> 或 <code>--path=task2</code>
        单独构建任务，通过 iframe 在同一页面预览。
      </p>
    </header>

    <main class="task-grid">
      <section class="task-panel">
        <h2>Task 1 · 计数器</h2>
        <iframe src="./task/task1/index.html" title="Task 1 演示"></iframe>
      </section>

      <section class="task-panel">
        <h2>Task 2 · 待办清单</h2>
        <iframe src="./task/task2/index.html" title="Task 2 演示"></iframe>
      </section>
    </main>
  </body>
</html>
